services:
  - type: web
    name: salesagents-lap-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: API_AUTH_TOKEN
        generateValue: true
      - key: RETELL_WEBHOOK_SECRET
        generateValue: true
